name: Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to FTP Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.DS_Store
            **/.venv/**
            **/Datasets/**
            **/.devcontainer/**
            **/*.docx
            **/*.pdf
            **/*.rtf

      - name: Trigger Node.js Passenger Restart
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 -c "
          import ftplib, os, io
          try:
              ftp = ftplib.FTP(os.environ['FTP_SERVER'])
              ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
              try:
                  ftp.mkd('tmp')
              except Exception:
                  pass
              ftp.storbinary('STOR tmp/restart.txt', io.BytesIO(b'restart\n'))
              print('Node.js Passenger restart triggered successfully.')
              ftp.quit()
          except Exception as e:
              print(f'Restart notice: {e}')
          "
